services:
  - type: web
    name: liquidez-pyme-agentica
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_RESPALDO
        value: gemini-3.1-flash-lite
      - key: LIMITE_CHAT_POR_MINUTO
        value: "10"
      - key: CONFIAR_PROXY
        value: "true"
      - key: FECHA_REFERENCIA
        value: "2026-10-28"
